apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: sp-vilkarsproving
  namespace: tbd
  labels:
    team: tbd
spec:
  gcp:
    sqlInstances:
      - type: POSTGRES_18
        diskAutoresize: true
        tier: {{ db.tier }}
        name: sp-vilkarsproving
        databases:
          - name: sp-vilkarsproving
            envVarPrefix: DATABASE
{{#if db.extraUsers}}
            users:
{{#each db.extraUsers as |extraUser|}}
              - name: {{ extraUser }}
{{/each}}
{{/if}}
  port: 8080
  startup:
    path: isready
    initialDelay: 20
    periodSeconds: 5
    failureThreshold: 9
  liveness:
    path: isalive
  readiness:
    path: isready
  preStopHook:
    http:
      path: /stop
  observability:
    autoInstrumentation:
      enabled: true
      runtime: java
    logging:
      destinations:
        - id: elastic
        - id: loki
        - id: team_logs
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 512Mi
  replicas:
    min: {{ minReplicas }}
    max: {{ maxReplicas }}
  strategy:
    rollingUpdate:
      maxSurge: 50%
      maxUnavailable: 50%
  kafka:
    pool: {{ kafkaPool }}
  azure:
    application:
      enabled: true
  prometheus:
    enabled: true
    path: /metrics
  env:
    - name: KAFKA_CONSUMER_GROUP_ID
      value: tbd-sp-vilkarsproving-v1
    - name: KAFKA_RAPID_TOPIC
      value: tbd.rapid.v1
  accessPolicy:
    outbound:
      rules:
        - application: logging
          namespace: nais-system
#    inbound:
#      rules:
#        - application:
